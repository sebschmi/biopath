[package]
name = "biopath"
description = "Shortest paths in biological overlap graphs with or without indexing."
authors = ["Sebastian Schmidt <sebastian.schmidt@helsinki.fi>"]
license = "BSD-2-Clause"
repository = "https://github.com/sebschmi/biopath"
version = "0.3.0"

edition = "2024"

[dependencies]
# CLI
clap = { version = "4.6.1", features = ["derive"] }
log = "0.4.32"
simplelog = "0.12.2"
anyhow = "1.0.102"
indicatif = "0.18.4"

# Data structures
spqr-shortest-path-index = { version = "1.4.0", features = ["binary-io"] }
bidirected-adjacency-array = "1.1.3"
spqr-tree = { version = "5.0.0" }

# Serde
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"

# Other
itertools = "0.15.0"
flate2 = "1.1.9"

[profile.release]
lto = true
debug = 1
